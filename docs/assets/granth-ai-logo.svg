<?xml version="1.0" encoding="UTF-8"?>
<!--
  GRANTH-AI logo — original artwork, MIT licensed with this repository.
  "GRAN" = book, "GRANTH" = a book / a treatise. The mark is an open book whose
  right-hand page turns into a knowledge pathway with three evidence nodes; the
  third node carries a check mark: an answer is only shown once it has a source.
  No third-party logo, brand mark or typeface outline is used. The Gujarati
  letter is drawn as a path, so the file renders without any installed font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="title desc">
  <title id="title">GRANTH-AI</title>
  <desc id="desc">An open book whose right page becomes a pathway of three connected nodes; the last node carries a check mark for a verified, cited answer.</desc>

  <defs>
    <linearGradient id="g-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f6e7d5"/>
    </linearGradient>
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d3a13"/>
      <stop offset="1" stop-color="#67240b"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a457"/>
      <stop offset="1" stop-color="#c9792b"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#g-brand)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- open book: left page, right page, spine -->
  <path d="M92 190c46-22 96-22 138 6v176c-42-28-92-28-138-6z" fill="url(#g-page)"/>
  <path d="M420 190c-46-22-96-22-138 6v176c42-28 92-28 138-6z" fill="#fff6ea"/>
  <path d="M256 196v176" stroke="#67240b" stroke-width="10" stroke-linecap="round"/>

  <!-- text lines on the left page (the source passage) -->
  <g stroke="#c9792b" stroke-width="11" stroke-linecap="round" opacity="0.95">
    <path d="M122 234h80"/>
    <path d="M122 264h80"/>
    <path d="M122 294h62"/>
  </g>

  <!-- knowledge pathway rising from the right page with three evidence nodes -->
  <path d="M300 318c26 0 26-46 56-46s30-52 60-52" fill="none" stroke="#c9792b" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="1 22"/>

  <circle cx="300" cy="318" r="17" fill="#fff6ea" stroke="#c9792b" stroke-width="9"/>
  <circle cx="356" cy="272" r="14" fill="#c9792b"/>
  <circle cx="416" cy="220" r="26" fill="url(#g-amber)" stroke="#fff6ea" stroke-width="7"/>
  <path d="M404 220l9 10 17-19" fill="none" stroke="#fffaf3" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gujarati-inspired typographic accent, drawn as a path so no font is needed:
       a horizontal headstroke with a rounded bowl below it, the base structure of
       letters such as ગ and ર. Sits on the same baseline as the page dots. -->
  <g stroke="#fff3e3" stroke-linecap="round" fill="none">
    <path d="M104 404h92" stroke-width="14"/>
    <path d="M124 404v18c0 17 12 28 28 28s28-11 28-28v-18" stroke-width="13"/>
  </g>
  <!-- three small page-dots: the pages a claim is traced back to -->
  <g fill="#e9a457">
    <circle cx="318" cy="428" r="9"/>
    <circle cx="352" cy="428" r="9"/>
    <circle cx="386" cy="428" r="9"/>
  </g>
</svg>
